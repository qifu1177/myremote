<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover + user-scalable=no:
      - "viewport-fit=cover" ist für iPhone/iPad mit Notch/Dynamic Island nötig,
        damit wir die Safe-Area-Insets per env(safe-area-inset-*) selbst
        berücksichtigen können.
      - "user-scalable=no" verhindert das native Doppeltipp-/Pinch-Zoom des
        Browsers, damit diese Gesten für die Fernsteuerung (Zoom im
        Remote-Bild) zur Verfügung stehen.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS: App im Vollbild starten, wenn sie zum Home-Bildschirm hinzugefügt wurde -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="mydesk" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>mydesk Mobile</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
